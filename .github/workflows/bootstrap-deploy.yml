# This is a basic workflow to help you get started with Actions

name: Ansible Agent Bootstrap
permissions:
  contents: read
  pull-requests: read
  issues: write

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - ansible/**
      - ubi-agent/**
      - roles/agent/**
      - .github/workflows/bootstrap-deploy.yml
      - .github/actions/ubi-agent-build/action.yml
      - ansible-agent.yml
env:
  DOCKER_REPOSITORY: coffee206/github-actions
  GITHUB_ACTIONS_VERSION: "2.337.0"

jobs:
  base-versioning:
    runs-on:
      - self-hosted
    outputs:
      x64_tag: x64-${{ env.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v2
      - uses: espresso-software/actions/common/versioning@main
        id: get_version
        with:
          version_file: ubi-agent/version.json

  base-build:
    needs:
      - base-versioning
    runs-on:
      - self-hosted
      - dev-desk
    env:
      TARGETARCH: linux-x64
    steps:
      - uses: actions/checkout@v2

      - name: Build and publish image
        uses: ./.github/actions/ubi-agent-build
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PAT }}
        with:
          actions_version: ${{ env.GITHUB_ACTIONS_VERSION }}
          targetarch: ${{ env.TARGETARCH }}
          build_directory: ubi-agent
          tag: ${{ needs.base-versioning.outputs.x64_tag }}.BOOTSTRAP
          platform: linux/amd64

  ansible-versioning:
    runs-on:
      - self-hosted
    outputs:
      x64_tag: x64-ansible-${{ env.IMAGE_VERSION }}
    steps:
      - uses: actions/checkout@v2
      - uses: espresso-software/actions/common/versioning@main
        id: get_version
        with:
          version_file: ansible/version.json

  ansible-build:
    needs:
      - base-versioning
      - base-build
      - ansible-versioning
    runs-on:
      - self-hosted
      - dev-desk
    env:
      TARGETARCH: linux-x64
      BUILD_DIR: ansible
    steps:
      - uses: actions/checkout@v2

      - name: Build and publish image
        uses: espresso-software/actions/docker/build-and-push@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          tag: ${{ needs.ansible-versioning.outputs.x64_tag }}.BOOTSTRAP
          build_dir: ${{ env.BUILD_DIR }}
          build_args: --build-arg TAG=${{ needs.base-versioning.outputs.x64_tag }}.BOOTSTRAP
          platform: linux/amd64
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PAT }}

  ansible-deploy:
    needs:
      - ansible-build
      - ansible-versioning
    runs-on:
      - self-hosted
      - dev-desk
    env:
      IMAGE_VERSION: ${{ needs.ansible-versioning.outputs.x64_tag }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
          token: ${{ secrets.READ_ACCESS_TOKEN }}
      - name: Ansible Playbook Deploy
        uses: espresso-software/actions/ansible/run-playbook@main
        env:
          VAULT_DECRYPT_TOKEN: ${{ secrets.VAULT_DECRYPT_TOKEN }}
        with:
          playbook_path: agent.ansible.yml
          inventory_path: inventory/restricted.yml
          hosts: ansible-k3s
          vars: agent_tag=${{ needs.ansible-versioning.outputs.x64_tag }}.BOOTSTRAP
