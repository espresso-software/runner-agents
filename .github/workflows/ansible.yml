# This is a basic workflow to help you get started with Actions

name: Ansible Image
permissions:
  contents: read
  pull-requests: read
  issues: write

# Controls when the workflow will run
on:
  push:
    branches-ignore:
      - main
    paths:
      - ansible/**
      - .github/workflows/ansible.yml
      - roles/agent/**
      - agent.ansible.yml
  pull_request:
    branches:
      - main
    paths:
      - ansible/**
      - agent.ansible.yml
      - docker.yml
      - .github/workflows/ansible.yml
      - roles/agent/**
  schedule:
    - cron: "0 12 * * 0"

env:
  DOCKER_REPOSITORY: coffee206/github-actions
  BUILD_DIR: ansible
  STATEFUL_SET_NAME: ansible

jobs:
  versioning:
    runs-on:
      group: builder
    outputs:
      x64_tag: x64-ansible-${{ env.IMAGE_VERSION }}
      arm64_tag: arm64-ansible-${{ env.IMAGE_VERSION }}
      common_tag: ansible-${{ env.IMAGE_VERSION }}
    steps:
      - uses: actions/checkout@v2
      - uses: espresso-software/actions/common/versioning@main
        id: get_version
        with:
          version_file: ansible/version.json

  arm64-build:
    needs:
      - versioning
    runs-on:
      group: builder
      labels:
        - ARM64
    steps:
      - uses: actions/checkout@v2

      - name: Build and publish image
        uses: espresso-software/actions/docker/build-and-push@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          tag: ${{ needs.versioning.outputs.arm64_tag }}.SNAPSHOT
          build_dir: ${{ env.BUILD_DIR }}
          platform: linux/arm64
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PAT }}

  x64-build:
    needs:
      - versioning
    runs-on:
      group: builder
      labels:
        - X64
    steps:
      - uses: actions/checkout@v2
      - name: Build and publish image
        uses: espresso-software/actions/docker/build-and-push@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          tag: ${{ needs.versioning.outputs.x64_tag }}.SNAPSHOT
          build_dir: ${{ env.BUILD_DIR }}
          platform: linux/amd64
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PAT }}

  uat-deploy:
    needs:
      - versioning
      - x64-build
    runs-on:
      group: ansible
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: "recursive"
          token: ${{ secrets.READ_ACCESS_TOKEN }}
      - name: Cleanup uat
        uses: espresso-software/actions/ansible/run-playbook@main
        env:
          VAULT_DECRYPT_TOKEN: ${{ secrets.VAULT_DECRYPT_TOKEN }}
        with:
          playbook_path: agent.cleanup.yml
          inventory_path: inventory/hosts.yml
          vars: agent_stateful_set_name=uat-${{ env.STATEFUL_SET_NAME }}
      - name: Deploy x64 image
        uses: espresso-software/actions/ansible/run-playbook@main
        env:
          VAULT_DECRYPT_TOKEN: ${{ secrets.VAULT_DECRYPT_TOKEN }}
        with:
          playbook_path: agent.test.yml
          inventory_path: inventory/hosts.yml
          vars: agent_stateful_set_name=uat-${{ env.STATEFUL_SET_NAME }} agent_tag=${{ needs.versioning.outputs.x64_tag }}.SNAPSHOT agent_arch=amd64

  promote:
    # if: github.event.pull_request || github.event_name == 'schedule'
    needs:
      - versioning
      - x64-build
      - arm64-build
      - uat-deploy
    runs-on:
      group: builder
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PAT }}
    steps:
      - name: Promote x64 image
        uses: espresso-software/actions/docker/promote@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          old_tag: ${{ needs.versioning.outputs.x64_tag }}.SNAPSHOT
          promote_tag: ${{ needs.versioning.outputs.x64_tag }}
          skip_cleanup: "true"

      - name: Promote arm64 image
        uses: espresso-software/actions/docker/promote@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          old_tag: ${{ needs.versioning.outputs.arm64_tag }}.SNAPSHOT
          promote_tag: ${{ needs.versioning.outputs.arm64_tag }}
          skip_cleanup: "true"

      - name: Create release manifest
        uses: espresso-software/actions/docker/common-tag@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          tag: ${{ needs.versioning.outputs.common_tag }}
          x64_tag: ${{ needs.versioning.outputs.x64_tag }}
          arm64_tag: ${{ needs.versioning.outputs.arm64_tag }}

      - name: Create latest manifest
        uses: espresso-software/actions/docker/common-tag@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          tag: latest
          x64_tag: ${{ needs.versioning.outputs.x64_tag }}
          arm64_tag: ${{ needs.versioning.outputs.arm64_tag }}

  uat-cleanup:
    needs:
      - uat-deploy
    runs-on:
      group: ansible
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
          token: ${{ secrets.READ_ACCESS_TOKEN }}
      - uses: espresso-software/actions/ansible/run-playbook@main
        env:
          VAULT_DECRYPT_TOKEN: ${{ secrets.VAULT_DECRYPT_TOKEN }}
        with:
          playbook_path: agent.cleanup.yml
          inventory_path: inventory/hosts.yml
          vars: agent_stateful_set_name=uat-${{ env.STATEFUL_SET_NAME }}

  deploy:
    # if: github.event.pull_request || github.event_name == 'schedule'
    needs:
      - versioning
      - promote
      - x64-build
      - arm64-build
      - uat-deploy
    runs-on:
      group: ansible-deploy
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
          token: ${{ secrets.READ_ACCESS_TOKEN }}
      - name: x64 deploy
        uses: espresso-software/actions/ansible/run-playbook@main
        env:
          VAULT_DECRYPT_TOKEN: ${{ secrets.VAULT_DECRYPT_TOKEN }}
        with:
          playbook_path: agent.ansible.yml
          inventory_path: inventory/hosts.yml
          vars: agent_tag=${{ needs.versioning.outputs.common_tag }}
