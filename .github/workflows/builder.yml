# This is a basic workflow to help you get started with Actions

name: Builder Image
permissions:
  contents: read
  pull-requests: read
  issues: write

# Controls when the workflow will run
on:
  push:
    branches-ignore:
      - main
    paths:
      - builder/**
      - .github/workflows/builder.yml
      - roles/agent/**
      - agent.builder.yml
  pull_request:
    branches:
      - main
    paths:
      - builder/**
      - agent.builder.yml
      - docker.yml
      - .github/workflows/builder.yml
      - roles/agent/**
  schedule:
    - cron: "0 12 * * 6"

env:
  BUILD_DIR: builder

jobs:
  versioning:
    runs-on:
      group: builder
    outputs:
      x64_tag: x64-builder-${{ env.IMAGE_VERSION }}
      arm64_tag: arm64-builder-${{ env.IMAGE_VERSION }}
      common_tag: builder-${{ env.IMAGE_VERSION }}
    steps:
      - uses: actions/checkout@v2
      - uses: espresso-software/actions/common/versioning@main
        id: get_version
        with:
          version_file: ${{ env.BUILD_DIR }}/version.json

  arm64:
    needs:
      - versioning
    uses: ./.github/workflows/agent-build-and-test.yml
    secrets: inherit
    with:
      architecture: ARM64
      image_tag: ${{ needs.versioning.outputs.arm64_tag }}

  x64:
    needs:
      - versioning
    uses: ./.github/workflows/agent-build-and-test.yml
    secrets: inherit
    with:
      architecture: X64
      image_tag: ${{ needs.versioning.outputs.x64_tag }}

  promote:
    if: github.event.pull_request || github.event_name == 'schedule'
    needs:
      - versioning
      - x64
      - arm64
    runs-on:
      group: builder
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PAT }}
    steps:
      - name: Promote x64 image
        uses: espresso-software/actions/docker/promote@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          old_tag: ${{ needs.versioning.outputs.x64_tag }}.SNAPSHOT
          promote_tag: ${{ needs.versioning.outputs.x64_tag }}
          skip_cleanup: "true"

      - name: Promote arm64 image
        uses: espresso-software/actions/docker/promote@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          old_tag: ${{ needs.versioning.outputs.arm64_tag }}.SNAPSHOT
          promote_tag: ${{ needs.versioning.outputs.arm64_tag }}
          skip_cleanup: "true"

      - name: Create release manifest
        uses: espresso-software/actions/docker/common-tag@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          tag: ${{ needs.versioning.outputs.common_tag }}
          x64_tag: ${{ needs.versioning.outputs.x64_tag }}
          arm64_tag: ${{ needs.versioning.outputs.arm64_tag }}

      - name: Create latest manifest
        uses: espresso-software/actions/docker/common-tag@main
        with:
          repository: ${{ env.DOCKER_REPOSITORY }}
          tag: latest
          x64_tag: ${{ needs.versioning.outputs.x64_tag }}
          arm64_tag: ${{ needs.versioning.outputs.arm64_tag }}

  deploy:
    if: github.event.pull_request || github.event_name == 'schedule'
    needs:
      - versioning
      - promote
      - x64-build
      - arm64-build
      - uat-deploy
    runs-on:
      group: ansible
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
          token: ${{ secrets.READ_ACCESS_TOKEN }}
      - name: x64 deploy
        uses: espresso-software/actions/ansible/run-playbook@main
        env:
          VAULT_DECRYPT_TOKEN: ${{ secrets.VAULT_DECRYPT_TOKEN }}
        with:
          playbook_path: agent.builder.yml
          inventory_path: inventory/hosts.yml
          vars: agent_tag=${{ needs.versioning.outputs.common_tag }}
